services:
  cubicle-api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cubicle}:${POSTGRES_PASSWORD:-cubicle}@postgres:5432/${POSTGRES_DB:-cubicle}
      - REDIS_URL=redis://redis:6379/0
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ./backend/app:/app/app
      - agent-workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cubicle-worker:
    build: ./backend
    command: celery -A app.workers worker -l info -Q tasks
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cubicle}:${POSTGRES_PASSWORD:-cubicle}@postgres:5432/${POSTGRES_DB:-cubicle}
      - REDIS_URL=redis://redis:6379/0
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ./backend/app:/app/app
      - agent-workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cubicle}
      POSTGRES_USER: ${POSTGRES_USER:-cubicle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cubicle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cubicle}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  agent-workspaces:
