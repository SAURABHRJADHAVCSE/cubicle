services:
  cubicle-api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cubicle}:${POSTGRES_PASSWORD:-cubicle}@postgres:5432/${POSTGRES_DB:-cubicle}
      - REDIS_URL=redis://redis:6379/0
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Must include whatever origin the browser/phone actually loads the
      # frontend from — "http://localhost:3000" alone blocks every request
      # from a LAN IP or a Tailscale/tunnel hostname with a CORS error, even
      # if NEXT_PUBLIC_API_URL/networking is otherwise all correctly set up.
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@localhost}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - STUN_URL=${STUN_URL:-stun:stun.l.google.com:19302}
      # Must be a browser/phone-reachable address, not coturn's compose
      # -internal hostname — same caveat as NEXT_PUBLIC_API_URL below.
      # Unset (STUN-only) by default since this file can't guess it.
      - TURN_URL=${TURN_URL:-}
      - TURN_USERNAME=${TURN_USERNAME:-cubicle}
      - TURN_CREDENTIAL=${TURN_PASSWORD:-changeme}
      # Absolute host-machine path that ./agent-workspaces (below) resolves
      # to — the container can't derive this on its own (bind mounts don't
      # expose their own host-side source path to the guest), so it's handed
      # in explicitly just so the UI can show/copy a real path to open on
      # your PC. Cosmetic only; leave unset and the file browser still works,
      # it just won't offer "open on my PC".
      - HOST_WORKSPACES_PATH=${HOST_WORKSPACES_PATH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      # Also bind-mounted (not just app/): this container is the one that
      # runs `alembic upgrade head` on every start and is where `docker
      # compose exec cubicle-api pytest` runs from — without these, a new
      # migration or test file only exists on the host until the next image
      # rebuild, silently running against a stale copy otherwise.
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      # Bind mount, not a named volume: agents' written files need to show up
      # as a real folder on the host (Explorer/VS Code), not sealed inside
      # Docker Desktop's VM where only `docker cp`/`docker run` can reach them.
      - ./agent-workspaces:/workspaces
      - claude-cli-home:/home/appuser/.claude
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cubicle-worker:
    build: ./backend
    command: celery -A app.workers worker -l info -Q tasks
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cubicle}:${POSTGRES_PASSWORD:-cubicle}@postgres:5432/${POSTGRES_DB:-cubicle}
      - REDIS_URL=redis://redis:6379/0
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./agent-workspaces:/workspaces
      - claude-cli-home:/home/appuser/.claude
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cubicle-beat:
    build: ./backend
    command: celery -A app.workers beat -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cubicle}:${POSTGRES_PASSWORD:-cubicle}@postgres:5432/${POSTGRES_DB:-cubicle}
      - REDIS_URL=redis://redis:6379/0
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cubicle-web:
    build:
      context: ./frontend
      args:
        # Left unset by default on purpose: the frontend now derives the
        # API/WS URL at runtime from whatever host the browser actually
        # loaded the page from (see frontend/src/lib/constants.ts), so the
        # same build works unmodified from localhost, a LAN IP, or a
        # Tailscale hostname. Only set these to force a specific address —
        # e.g. a Caddy deployment routing everything through one origin.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - cubicle-api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - cubicle-web
      - cubicle-api

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command: >
      -n
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --realm=${TURN_REALM:-cubicle.local}
      --lt-cred-mech
      --user=${TURN_USERNAME:-cubicle}:${TURN_PASSWORD:-changeme}
      --no-cli
      --no-tls
      --no-dtls
      --fingerprint

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cubicle}
      POSTGRES_USER: ${POSTGRES_USER:-cubicle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cubicle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cubicle}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  claude-cli-home:
  caddy-data:
  caddy-config:
